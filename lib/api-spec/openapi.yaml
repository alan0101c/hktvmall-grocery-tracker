openapi: 3.1.0
info:
  title: Api
  version: 0.5.0
  description: HKTVMall Grocery Price Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Tracked product management
  - name: product-types
    description: User-defined product type configuration
  - name: alerts
    description: Price alert management
  - name: scheduler
    description: Scheduler configuration and status
  - name: settings
    description: App-wide settings (e.g. global discount adjustment)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Get all tracked products
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by product name or category name
        - name: belowAlert
          in: query
          schema:
            type: boolean
          description: Only products currently below their alert price
      responses:
        "200":
          description: List of tracked products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/track:
    post:
      operationId: trackProduct
      tags: [products]
      summary: Add a product to the watchlist by HKTVMall URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackProductRequest"
      responses:
        "201":
          description: Product tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid URL or product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/search:
    get:
      operationId: searchHKTVMall
      tags: [products]
      summary: Search HKTVMall for products to add
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search keyword
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  /products/refresh:
    post:
      operationId: refreshAllProducts
      tags: [products]
      summary: Manually trigger a price refresh for all tracked products
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product with price history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Remove a product from the watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /products/{id}/refresh:
    post:
      operationId: refreshProduct
      tags: [products]
      summary: Refresh price for a single tracked product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}/unit:
    put:
      operationId: updateProductUnit
      tags: [products]
      summary: Update unit/type metadata for a tracked product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductUnitRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /product-types:
    get:
      operationId: getProductTypes
      tags: [product-types]
      summary: List all product types
      responses:
        "200":
          description: List of product types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductType"
    post:
      operationId: createProductType
      tags: [product-types]
      summary: Create a new product type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductTypeRequest"
      responses:
        "201":
          description: Product type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductType"

  /product-types/{id}:
    patch:
      operationId: updateProductType
      tags: [product-types]
      summary: Update a product type's name and/or unit label
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductTypeRequest"
      responses:
        "200":
          description: Updated product type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductType"
    delete:
      operationId: deleteProductType
      tags: [product-types]
      summary: Delete a product type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get all price alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Set a price alert for a tracked product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertRequest"
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Remove a price alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /alerts/triggered:
    get:
      operationId: getTriggeredAlerts
      tags: [alerts]
      summary: Get alerts where current price is at or below target
      responses:
        "200":
          description: Triggered alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TriggeredAlert"

  /scheduler:
    get:
      operationId: getScheduler
      tags: [scheduler]
      summary: Get scheduler status
      responses:
        "200":
          description: Scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStatus"
    put:
      operationId: updateScheduler
      tags: [scheduler]
      summary: Update scheduler interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchedulerRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStatus"

  /settings:
    get:
      operationId: getAppSettings
      tags: [settings]
      summary: Get app-wide settings
      responses:
        "200":
          description: App settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateAppSettings
      tags: [settings]
      summary: Update app-wide settings (global discount adjustment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ProductType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Human label for this category, e.g. "Adult Mouthwash"
        unitLabel:
          type: string
          description: Unit to measure by, e.g. "ml", "g", "tablet", "pack"
        createdAt:
          type: string
          format: date-time
      required: [id, name, unitLabel, createdAt]

    CreateProductTypeRequest:
      type: object
      properties:
        name:
          type: string
        unitLabel:
          type: string
      required: [name, unitLabel]

    UpdateProductTypeRequest:
      type: object
      properties:
        name:
          type: string
        unitLabel:
          type: string
          description: >-
            New unit for the category, canonicalised to lowercase. Changing the unit (beyond
            case) redefines what every member quantity means, so it is only accepted together
            with `listings` re-submitting the reviewed quantities in the new unit. The whole
            update is applied atomically — category unit, member units, and quantities.
        listings:
          type: array
          description: >-
            Reviewed member quantities, applied in the same transaction as the unit change.
            Each entry must reference a product that currently belongs to this category.
          items:
            type: object
            properties:
              productId:
                type: integer
              packageQuantity:
                type: number
                nullable: true
              itemCount:
                type: integer
                nullable: true
            required: [productId]

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameZh:
          type: string
        brand:
          type: string
        category:
          type: string
        currentPrice:
          type: number
        adjustedPrice:
          type: number
          nullable: true
          description: Effective price after the global discount adjustment (equals currentPrice when no discount is set)
        globalDiscountPercent:
          type: number
          description: The app-wide discount percentage in effect when this response was built (0 = none)
        originalPrice:
          type: number
        plusPrice:
          type: number
          nullable: true
          description: Deprecated — HKTVmall cancelled the Plus membership. Always null for newly scraped/refreshed products; may still be present on legacy rows.
        promotionTexts:
          type: array
          items:
            type: string
          description: All promotion texts scraped from HKTVMall product page (always present, may be empty)
        currency:
          type: string
        imageUrl:
          type: string
        productUrl:
          type: string
        sku:
          type: string
        inStock:
          type: boolean
        productTypeId:
          type: integer
          nullable: true
          description: Reference to a user-defined product type
        packageQuantity:
          type: number
          nullable: true
          description: Size of each natural unit (e.g. 950 for 950ml per bottle)
        packageUnit:
          type: string
          nullable: true
          description: The unit used for the unit price — resolved from the product's category (every product in a category shares the same unit), falling back to the unit the quantity was recorded in for uncategorised products. Null when no unit is known.
        productTypeName:
          type: string
          description: Resolved name of the product type (category)
        itemCount:
          type: integer
          nullable: true
          description: Number of natural units in the package (e.g. 3 for a 3-pack). When set, pricePerUnit = price / itemCount (price per 950ml bottle). When null, pricePerUnit = price / packageQuantity (price per ml).
        pricePerUnit:
          type: number
          nullable: true
          description: "Per-item mode (itemCount set): price per item. Total mode (itemCount null): price per packageUnit."
        lastUpdated:
          type: string
          format: date-time
        alertPrice:
          type: number
          nullable: true
        isBelowAlert:
          type: boolean
        priceChange:
          type: number
          description: Price change since last check (positive = increase, negative = drop)
          nullable: true
        status:
          type: string
          enum: [active, unavailable]
          description: "active = listed on HKTVmall; unavailable = product page could no longer be parsed (removed/delisted from HKTVmall). The record and its price history are kept either way."
        lastRefreshError:
          type: string
          nullable: true
          description: Message from the last failed refresh attempt, if any.
      required:
        - id
        - name
        - currentPrice
        - currency
        - lastUpdated
        - isBelowAlert

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            priceHistory:
              type: array
              items:
                $ref: "#/components/schemas/PriceRecord"
          required: [priceHistory]

    PriceRecord:
      type: object
      properties:
        id:
          type: integer
        price:
          type: number
        originalPrice:
          type: number
        plusPrice:
          type: number
          nullable: true
          description: Deprecated — HKTVmall cancelled the Plus membership. Null for records created after the cancellation.
        promotionTexts:
          type: array
          items:
            type: string
          description: All promotion texts at time of recording (always present, may be empty)
        inStock:
          type: boolean
          description: Whether the product was in stock at time of recording
        recordedAt:
          type: string
          format: date-time
      required: [id, price, inStock, recordedAt]

    UpdateProductUnitRequest:
      type: object
      properties:
        productTypeId:
          type: integer
          nullable: true
          description: Category to assign. The product's unit is adopted from the category and can never be set here.
        packageQuantity:
          type: number
          nullable: true
          description: >-
            Size of each natural unit (e.g. 950 for 950ml per bottle), expressed in the
            category's unit. When the product moves to a category with a different unit,
            the stored quantity is cleared (quarantined) because it was expressed in the
            old unit — re-enter it here in the new unit.
        itemCount:
          type: integer
          nullable: true
          description: Number of items in the package. When set, pricePerUnit = price / itemCount.

    Alert:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        targetPrice:
          type: number
        currentPrice:
          type: number
        adjustedPrice:
          type: number
          nullable: true
          description: Effective price after the global discount adjustment
        isTriggered:
          type: boolean
          description: Whether the adjusted price is at or below the target price
        createdAt:
          type: string
          format: date-time
      required: [id, productId, productName, targetPrice, currentPrice, isTriggered, createdAt]

    TriggeredAlert:
      type: object
      properties:
        alertId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        productUrl:
          type: string
        imageUrl:
          type: string
        currentPrice:
          type: number
        adjustedPrice:
          type: number
          nullable: true
          description: Effective price after the global discount adjustment
        targetPrice:
          type: number
        savings:
          type: number
          description: Amount saved versus the adjusted price (targetPrice - adjustedPrice)
        currency:
          type: string
      required: [alertId, productId, productName, currentPrice, targetPrice, savings, currency]

    SearchResult:
      type: object
      properties:
        name:
          type: string
        nameZh:
          type: string
        brand:
          type: string
        currentPrice:
          type: number
        originalPrice:
          type: number
        currency:
          type: string
        imageUrl:
          type: string
        productUrl:
          type: string
        sku:
          type: string
        isTracked:
          type: boolean
      required: [name, currentPrice, currency, productUrl, isTracked]

    TrackProductRequest:
      type: object
      properties:
        productUrl:
          type: string
          description: Full HKTVMall product URL
        name:
          type: string
          description: Optional manual name override
        targetPrice:
          type: number
          description: Optional alert price to set immediately
        productTypeId:
          type: integer
          nullable: true
          description: Optional product type to assign — the product's unit is adopted from the category
        packageQuantity:
          type: number
          nullable: true
          description: Package size (e.g. 500 for 500ml), expressed in the assigned category's unit
      required: [productUrl]

    RefreshResult:
      type: object
      properties:
        refreshed:
          type: integer
        failed:
          type: integer
        unavailable:
          type: integer
          description: Number of products that could not be refreshed because they are no longer listed on HKTVmall (marked unavailable, records kept).
        priceDrops:
          type: integer
        errors:
          type: array
          items:
            type: string
      required: [refreshed, failed, unavailable, priceDrops, errors]

    SchedulerStatus:
      type: object
      properties:
        enabled:
          type: boolean
        intervalHours:
          type: integer
        lastRun:
          type: string
          format: date-time
          nullable: true
        nextRun:
          type: string
          format: date-time
          nullable: true
        totalRuns:
          type: integer
      required: [enabled, intervalHours, totalRuns]

    UpdateSchedulerRequest:
      type: object
      properties:
        enabled:
          type: boolean
        intervalHours:
          type: integer
          description: How often to check prices (1, 3, 6, 12, 24)
      required: [enabled, intervalHours]

    CreateAlertRequest:
      type: object
      properties:
        productId:
          type: integer
        targetPrice:
          type: number
      required: [productId, targetPrice]

    AppSettings:
      type: object
      properties:
        globalDiscountPercent:
          type: number
          description: App-wide discount percentage applied on top of listed prices (e.g. 15 for a sitewide 15% off promotion). 0 = no adjustment.
        updatedAt:
          type: string
          format: date-time
      required: [globalDiscountPercent]

    UpdateSettingsRequest:
      type: object
      properties:
        globalDiscountPercent:
          type: number
          minimum: 0
          maximum: 100
          description: App-wide discount percentage (0–100)
      required: [globalDiscountPercent]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
